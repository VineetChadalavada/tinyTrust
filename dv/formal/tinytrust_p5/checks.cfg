[options]
isa rv32i
nret 1

[depth]
insn            25
# NOTE (docs/RETARGET.md P2): the multicycle config needs insn_sll/srl/sra/
# slli/srli/srai at depth 60, because its shifter is iterative at 1 bit per
# cycle (D5) and a 31-bit shift alone costs 31 cycles. The 5-stage core has a
# single-cycle barrel shifter, so shifts prove at the same depth as every
# other instruction and those six overrides are gone. That is a real reduction
# in proof cost, not just a config tidy-up.

# reg CHECK_CYCLE is 20 here, against 30 in the multicycle config. That is a
# deliberate retune and it is NOT a weaker proof — the number to hold constant
# is instructions covered, not cycles.
#
# CHECK_CYCLE 30 leaves 20 operating cycles after the 10-cycle reset. At the
# multicycle core's CPI (~7 in this environment) that unrolls roughly 3
# instructions. The pipeline retires at CPI ~1-2 under the wrapper's bus
# fairness assumption, so the *same* 20 cycles unroll 10-20 instructions —
# several times the state space, on a design that also has a forwarding network
# the multicycle core does not have. Measured: abc-bmc3 closes the multicycle
# reg check at depth 30 in ~9 min and had not closed the pipelined one after
# 30+ min. (Finding a counterexample is cheap in comparison: the BUG-005
# violation came back in 8 s.)
#
# 20 leaves 10 operating cycles, which at the pipeline's rate still unrolls
# ~5-10 instructions — more than the multicycle core gets at 30, so the
# register-consistency invariant is checked over more instructions here, not
# fewer. What it covers: ALU and load write->read hazards through every
# forwarding path, including the WB-across-a-stall case of BUG-005, which the
# directed `fwd_stall` test plus +fastmem also guards in sim.
#
# runchecks.py routes this check to abc-bmc3 on a memory_map'd netlist (see
# HEAVY_ENGINE there) — smtbmc/boolector, the genchecks default, cannot.
reg       10    20
pc_fwd    5     30
pc_bwd    5     30
unique    1  10 30
causal    10    30
liveness  1  20 60
cover     1     30

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

# NOTE: @core@ is spelled out because riscv-formal's genchecks.py derives
# the core name with os.getcwd().split("/") — broken on Windows paths
# (upstream-issue candidate per VPLAN §9).
[verilog-files]
@basedir@/cores/tinytrust_p5/wrapper.sv
@basedir@/../../../rtl/core/core_p5.v
@basedir@/../../../rtl/core/regfile.v
@basedir@/../../../rtl/core/pmp.v

[cover]
# Non-vacuity guard: the environment must actually be able to retire
# instructions, or every bounded proof above passes for the wrong
# reason. `>= 3` rather than `== 3` because the two cores reach step 30
# at different instruction counts — the 5-stage core cannot retire as
# few as exactly 3 by then even on the slowest bus schedule the
# fairness assumption allows, so `== 3` is unreachable for it. The
# inequality states the property both cores are meant to have and keeps
# the two configs directly comparable.
always @* if (!reset) cover (channel[0].cnt_insns >= 3);
