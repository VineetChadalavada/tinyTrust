[options]
isa rv32i
nret 1

[depth]
insn            25
insn_sll        60
insn_srl        60
insn_sra        60
insn_slli       60
insn_srli       60
insn_srai       60
# reg CHECK_CYCLE capped at 30 (20 operating cycles after the 10-cycle reset).
# The register-consistency invariant holds; the *proof* cost is exponential in
# CHECK_CYCLE — at 40 no available solver (boolector/bitwuzla/btormc/abc/yices)
# closes it in <30 min, at 30 abc-bmc3 closes it in ~9 min. 20 op-cycles covers
# ALU/load/short-shift write->read hazards; long-latency-shift-writer forwarding
# is covered by the ISS co-sim's 353k random instructions (real dependency
# chains). runchecks.py routes this check to abc-bmc3 on a memory_map'd netlist
# (see HEAVY_ENGINE there) — smtbmc/boolector, the genchecks default, cannot.
reg       10    30
pc_fwd    5     30
pc_bwd    5     30
unique    1  10 30
causal    10    30
liveness  1  20 60
cover     1     30

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

# NOTE: @core@ is spelled out because riscv-formal's genchecks.py derives
# the core name with os.getcwd().split("/") — broken on Windows paths
# (upstream-issue candidate per VPLAN §9).
[verilog-files]
@basedir@/cores/tinytrust/wrapper.sv
@basedir@/../../../rtl/core/core.v
@basedir@/../../../rtl/core/regfile.v
@basedir@/../../../rtl/core/pmp.v

[cover]
# Non-vacuity guard: the environment must actually be able to retire
# instructions, or every bounded proof above passes for the wrong
# reason. `>= 3` rather than `== 3` because the two cores reach step 30
# at different instruction counts — the 5-stage core cannot retire as
# few as exactly 3 by then even on the slowest bus schedule the
# fairness assumption allows, so `== 3` is unreachable for it. The
# inequality states the property both cores are meant to have and keeps
# the two configs directly comparable.
always @* if (!reset) cover (channel[0].cnt_insns >= 3);
